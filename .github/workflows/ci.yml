name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHPCS (PHP compatibility 8.2-8.5)
        run: vendor/bin/phpcs --standard=phpcs.xml

      - name: Composer Audit
        run: composer audit

      - name: Rector (dry-run)
        run: vendor/bin/rector --dry-run

      - name: Pint (check)
        run: vendor/bin/pint --test

  test-unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHPUnit (unit)
        run: vendor/bin/phpunit -c tests/phpunit.xml --testsuite unit

  test-heavy:
    name: Integration & System tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.5-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-8.5-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Cache Mage-OS sandbox
        id: sandbox-cache
        uses: actions/cache@v4
        with:
          path: tests/sandbox
          key: sandbox-v1-${{ hashFiles('tests/sandbox/composer.json', 'tests/sandbox/composer.lock') }}-${{ hashFiles('tests/sandbox/app/code/**') }}

      - name: Install Mage-OS sandbox
        if: steps.sandbox-cache.outputs.cache-hit != 'true'
        run: composer install -d tests/sandbox --no-interaction --no-progress --no-dev --prefer-dist

      - name: PHPUnit (integration + system)
        run: vendor/bin/paratest -c tests/phpunit.xml --processes=4 --testsuite integration,system

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep — code scan
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
